<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agent Design Comparison Infographic (SVG)</title>
    <style>
      body { background: #f5f7fb; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
      svg { box-shadow: 0 8px 30px rgba(20,30,60,0.08); border-radius:12px; }
      .small { font-size:12px; fill:#334155; }
    </style>
  </head>
  <body>
    <!-- SVG infographic: 1200x800 -->
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Agent design comparison infographic">
      <defs>
        <linearGradient id="g1" x1="0" x2="1">
          <stop offset="0%" stop-color="#eef2ff" />
          <stop offset="100%" stop-color="#fff" />
        </linearGradient>
        <style>
          .title { font: 700 28px/1.1 'Segoe UI', Roboto, Helvetica, Arial; fill:#0f172a }
          .subtitle { font: 600 14px/1.1 'Segoe UI', Roboto, Helvetica, Arial; fill:#334155 }
          .panel-title { font: 700 18px 'Segoe UI', Roboto, Arial; fill:#0b1220 }
          .panel-desc { font: 400 13px 'Segoe UI', Roboto, Arial; fill:#213547 }
          .bullet { font: 400 12px 'Segoe UI', Roboto, Arial; fill:#475569 }
          .pill { font:700 12px 'Segoe UI', Roboto, Arial; fill:#0b1220 }
        </style>
      </defs>

      <!-- Background -->
      <rect width="1200" height="800" rx="12" fill="url(#g1)" />

      <!-- Header -->
      <g transform="translate(40,36)">
        <text class="title">Agent Design Comparison</text>
        <text x="0" y="36" class="subtitle">Quick visual guide to choose between Fixed Goal, Adaptive Goal, Multi-Skill, and Specialized agents</text>
      </g>

      <!-- Panels container -->
      <g transform="translate(40,110)">
        <!-- panel widths -->
        <!-- Each panel: width 270, gap 30 -->

        <!-- Fixed Goal Agent -->
        <g transform="translate(0,0)">
          <rect width="270" height="620" rx="12" fill="#ffffff" stroke="#e6eef8" />
          <!-- Icon circle -->
          <circle cx="44" cy="46" r="28" fill="#e6f0ff" />
          <text x="44" y="52" text-anchor="middle" class="pill">🔒</text>
          <text x="20" y="96" class="panel-title">Fixed Goal Agent</text>

          <text x="20" y="126" class="panel-desc">Operates with a predefined, fixed goal throughout its lifecycle.</text>

          <rect x="20" y="150" width="230" height="1" fill="#eef3fb" />

          <text x="20" y="172" class="subtitle" style="font-weight:600; font-size:13px;">Why it matters</text>
          <text x="20" y="192" class="bullet">• Simplicity, predictability, easy evaluation.</text>

          <text x="20" y="226" class="subtitle" style="font-weight:600; font-size:13px;">How to decide</text>
          <text x="20" y="246" class="bullet">• Is the domain stable and well-defined?</text>
          <text x="20" y="266" class="bullet">• Are objectives unlikely to change?</text>
          <text x="20" y="286" class="bullet">• Is operational simplicity a priority?</text>

          <text x="20" y="322" class="subtitle" style="font-weight:600; font-size:13px;">What to do / avoid</text>
          <text x="20" y="342" class="bullet">• Do: Define goal upfront; keep scope small.</text>
          <text x="20" y="362" class="bullet">• Avoid: Rigid goals that ignore context.</text>

          <text x="20" y="398" class="subtitle" style="font-weight:600; font-size:13px;">Starter / Tools</text>
          <text x="20" y="418" class="bullet">• Static goal at config; rule-based tasks.</text>

          <text x="20" y="452" class="subtitle" style="font-weight:600; font-size:13px;">Bottom line</text>
          <text x="20" y="472" class="panel-desc">Choose when requirements are fixed and simple.</text>
        </g>

        <!-- Adaptive Goal Agent -->
        <g transform="translate(300,0)">
          <rect width="270" height="620" rx="12" fill="#ffffff" stroke="#e6eef8" />
          <circle cx="44" cy="46" r="28" fill="#fff7e6" />
          <text x="44" y="52" text-anchor="middle" class="pill">🔄</text>
          <text x="20" y="96" class="panel-title">Adaptive Goal Agent</text>

          <text x="20" y="126" class="panel-desc">Agent can adjust or expand its goal based on context or feedback.</text>

          <rect x="20" y="150" width="230" height="1" fill="#fff7ee" />

          <text x="20" y="172" class="subtitle" style="font-weight:600; font-size:13px;">Why it matters</text>
          <text x="20" y="192" class="bullet">• Enables flexibility and responsiveness.</text>

          <text x="20" y="226" class="subtitle" style="font-weight:600; font-size:13px;">How to decide</text>
          <text x="20" y="246" class="bullet">• Need to adapt goals from input or environment?</text>
          <text x="20" y="266" class="bullet">• Are there identifiable triggers for updates?</text>
          <text x="20" y="286" class="bullet">• Can some goal variability be tolerated?</text>

          <text x="20" y="322" class="subtitle" style="font-weight:600; font-size:13px;">What to do / avoid</text>
          <text x="20" y="342" class="bullet">• Do: Design clear triggers/conditions for change.</text>
          <text x="20" y="362" class="bullet">• Avoid: Goal drift causing unpredictability.</text>

          <text x="20" y="398" class="subtitle" style="font-weight:600; font-size:13px;">Starter / Tools</text>
          <text x="20" y="418" class="bullet">• Simple rules, feedback loops, RL approaches.</text>

          <text x="20" y="452" class="subtitle" style="font-weight:600; font-size:13px;">Bottom line</text>
          <text x="20" y="472" class="panel-desc">Choose when environment is dynamic and adaptive behavior is needed.</text>
        </g>

        <!-- Multi-Skill Agent -->
        <g transform="translate(600,0)">
          <rect width="270" height="620" rx="12" fill="#ffffff" stroke="#e6eef8" />
          <circle cx="44" cy="46" r="28" fill="#eefdf6" />
          <text x="44" y="52" text-anchor="middle" class="pill">🧠</text>
          <text x="20" y="96" class="panel-title">Multi-Skill Agent</text>

          <text x="20" y="126" class="panel-desc">Agent is equipped with multiple diverse skills it can select as appropriate.</text>

          <rect x="20" y="150" width="230" height="1" fill="#f0fff6" />

          <text x="20" y="172" class="subtitle" style="font-weight:600; font-size:13px;">Why it matters</text>
          <text x="20" y="192" class="bullet">• Enhances versatility and usability across scenarios.</text>

          <text x="20" y="226" class="subtitle" style="font-weight:600; font-size:13px;">How to decide</text>
          <text x="20" y="246" class="bullet">• Will it handle multiple distinct tasks?</text>
          <text x="20" y="266" class="bullet">• Is dynamic skill selection or composition required?</text>
          <text x="20" y="286" class="bullet">• Is modular skill architecture feasible?</text>

          <text x="20" y="322" class="subtitle" style="font-weight:600; font-size:13px;">What to do / avoid</text>
          <text x="20" y="342" class="bullet">• Do: Design skills to be modular and composable.</text>
          <text x="20" y="362" class="bullet">• Avoid: Skill overlaps causing conflicts.</text>

          <text x="20" y="398" class="subtitle" style="font-weight:600; font-size:13px;">Starter / Tools</text>
          <text x="20" y="418" class="bullet">• Skill management frameworks and APIs.</text>

          <text x="20" y="452" class="subtitle" style="font-weight:600; font-size:13px;">Bottom line</text>
          <text x="20" y="472" class="panel-desc">Choose when versatility across tasks is valuable.</text>
        </g>

        <!-- Specialized Skill Agent -->
        <g transform="translate(900,0)">
          <rect width="270" height="620" rx="12" fill="#ffffff" stroke="#e6eef8" />
          <circle cx="44" cy="46" r="28" fill="#fff0f6" />
          <text x="44" y="52" text-anchor="middle" class="pill">🎯</text>
          <text x="20" y="96" class="panel-title">Specialized Skill Agent</text>

          <text x="20" y="126" class="panel-desc">Agent focuses deeply on one specialized skill for a narrow task domain.</text>

          <rect x="20" y="150" width="230" height="1" fill="#fff4f8" />

          <text x="20" y="172" class="subtitle" style="font-weight:600; font-size:13px;">Why it matters</text>
          <text x="20" y="192" class="bullet">• Allows deep expertise and high performance.</text>

          <text x="20" y="226" class="subtitle" style="font-weight:600; font-size:13px;">How to decide</text>
          <text x="20" y="246" class="bullet">• Is deep expertise in a narrow domain required?</text>
          <text x="20" y="266" class="bullet">• Are high performance and accuracy prioritized?</text>
          <text x="20" y="286" class="bullet">• Is ample domain-specific data available?</text>

          <text x="20" y="322" class="subtitle" style="font-weight:600; font-size:13px;">What to do / avoid</text>
          <text x="20" y="342" class="bullet">• Do: Invest in high-quality training and tuning data.</text>
          <text x="20" y="362" class="bullet">• Avoid: Overfitting; limited generalizability.</text>

          <text x="20" y="398" class="subtitle" style="font-weight:600; font-size:13px;">Starter / Tools</text>
          <text x="20" y="418" class="bullet">• Domain-specific models; fine-tuning datasets.</text>

          <text x="20" y="452" class="subtitle" style="font-weight:600; font-size:13px;">Bottom line</text>
          <text x="20" y="472" class="panel-desc">Choose when deep expertise in one domain is required.</text>
        </g>
      </g>
    </svg>
  </body>
</html>
